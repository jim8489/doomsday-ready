# Render Blueprint for the public assessment demo.
# Create a Neon PostgreSQL database first, then supply its connection
# components when Render prompts for the sync:false environment variables.
services:
  - type: web
    name: doomsday-ready-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://doomsday-ready-frontend.onrender.com
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_SSLMODE
        value: require
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"

  - type: web
    name: doomsday-ready-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://doomsday-ready-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
